<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Tela de Login</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div class="estrelas"></div>
    <div class="formulario">
        <h1>Login</h1>
        <form action="#">

            <div class="caixa-formulario">
                <input type="texto" placeholder="Nome de usuário" required>
                <i class='bx bxs-user'></i>

            </div>
            <div class="caixa-formulario">
                <input type="password" placeholder="Senha" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="caixa-lembrar-esqueci">
               <label for="#"><input type="checkbox">Lembrar</label>

                <a href="http://">Esqueci minha senha</a>

            </div>

            <button type="submit">Faça seu Login</button>

           <div class="link-registro">
            <p>Não tem conta?<a href="http://">Registrar</a></p>
           </div>

        </form>
    </div>
</body>

</html>
